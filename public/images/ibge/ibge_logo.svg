<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="ibgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003399"/>
      <stop offset="50%" stop-color="#002266"/>
      <stop offset="100%" stop-color="#00143d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="94" fill="url(#ibgeGrad)" stroke="#FFD700" stroke-width="4"/>
  
  <!-- Stylized Globe / Meridians -->
  <ellipse cx="100" cy="100" rx="72" ry="72" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <ellipse cx="100" cy="100" rx="42" ry="72" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
  <ellipse cx="100" cy="100" rx="16" ry="72" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>
  <line x1="28" y1="100" x2="172" y2="100" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <line x1="38" y1="65" x2="162" y2="65" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="38" y1="135" x2="162" y2="135" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="4,3"/>
  
  <!-- Golden Brazil Map Silhouette / Accent -->
  <path d="M 85,55 Q 115,50 128,70 Q 138,85 125,110 Q 115,125 102,142 Q 95,148 90,138 Q 80,122 75,105 Q 70,85 85,55 Z" fill="url(#goldGrad)" opacity="0.35"/>
  
  <!-- Banner with IBGE Text -->
  <rect x="35" y="82" width="130" height="38" rx="8" fill="#001f4d" stroke="#FFD700" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">IBGE</text>
  
  <!-- Subtitle -->
  <text x="100" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#FFD700" text-anchor="middle" letter-spacing="1">GEOGRAFIA &amp; ESTATÍSTICA</text>
</svg>
