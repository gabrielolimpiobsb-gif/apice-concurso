<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 380" width="100%" height="auto" style="max-width: 620px; font-family: sans-serif; background: #ffffff; border-radius: 12px; padding: 10px; border: 1px solid #e2e8f0;">
  <text x="325" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Coordenadas Geográficas - Paralelos e Meridianos</text>
  
  <g transform="translate(45, 40)">
    <!-- Fundo do mapa / grade -->
    <rect x="0" y="0" width="560" height="280" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />

    <!-- Meridianos (Verticais) a cada 40px = 20 graus -->
    <!-- Oeste: 180, 160, 140, 120, 100, 80, 60, 40, 20 -->
    <!-- Greenwich: 0 (x=280) -->
    <!-- Leste: 20, 40, 60, 80, 100, 120, 140, 160, 180 -->
    
    <!-- Paralelos (Horizontais) a cada 17.5px = 10 graus -->
    <!-- 80N a 80S. Equador 0: y=140 -->

    <!-- Grid lines -->
    <!-- Horizontais -->
    <line x1="0" y1="35" x2="560" y2="35" stroke="#cbd5e1" stroke-width="1" />
    <text x="-5" y="39" font-size="9" fill="#64748b" text-anchor="end">60°</text>
    
    <line x1="0" y1="52.5" x2="560" y2="52.5" stroke="#cbd5e1" stroke-width="1" />
    <text x="-5" y="56" font-size="9" fill="#ef4444" font-weight="bold" text-anchor="end">50°N</text>

    <line x1="0" y1="70" x2="560" y2="70" stroke="#cbd5e1" stroke-width="1" />
    <text x="-5" y="74" font-size="9" fill="#ef4444" font-weight="bold" text-anchor="end">40°N</text>

    <line x1="0" y1="105" x2="560" y2="105" stroke="#cbd5e1" stroke-width="1" />
    <text x="-5" y="109" font-size="9" fill="#64748b" text-anchor="end">20°N</text>

    <!-- Linha do Equador -->
    <line x1="0" y1="140" x2="560" y2="140" stroke="#0284c7" stroke-width="2" />
    <text x="-5" y="144" font-size="10" fill="#0284c7" font-weight="bold" text-anchor="end">0°</text>
    <text x="565" y="144" font-size="10" fill="#0284c7" font-weight="bold">Equador (0°)</text>

    <line x1="0" y1="157.5" x2="560" y2="157.5" stroke="#cbd5e1" stroke-width="1" />
    <text x="-5" y="161" font-size="9" fill="#ef4444" font-weight="bold" text-anchor="end">10°S</text>

    <line x1="0" y1="175" x2="560" y2="175" stroke="#cbd5e1" stroke-width="1" />
    <text x="-5" y="179" font-size="9" fill="#ef4444" font-weight="bold" text-anchor="end">20°S</text>

    <line x1="0" y1="210" x2="560" y2="210" stroke="#cbd5e1" stroke-width="1" />
    <text x="-5" y="214" font-size="9" fill="#64748b" text-anchor="end">40°S</text>

    <line x1="0" y1="245" x2="560" y2="245" stroke="#cbd5e1" stroke-width="1" />
    <text x="-5" y="249" font-size="9" fill="#64748b" text-anchor="end">60°S</text>

    <!-- Verticais -->
    <!-- Greenwich (x=280) -->
    <line x1="280" y1="0" x2="280" y2="280" stroke="#0284c7" stroke-width="2" />
    <text x="280" y="-8" font-size="10" fill="#0284c7" font-weight="bold" text-anchor="middle">Greenwich (0°)</text>
    <text x="280" y="295" font-size="10" fill="#0284c7" font-weight="bold" text-anchor="middle">0°</text>

    <!-- Oeste (Esquerda de Greenwich): cada 20 graus = 31.1px -->
    <!-- 100°O = x = 280 - (5 * 31.1) = 280 - 155.5 = 124.5 -->
    <line x1="124.5" y1="0" x2="124.5" y2="280" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3" />
    <text x="124.5" y="-8" font-size="9" fill="#ef4444" font-weight="bold" text-anchor="middle">100°O</text>

    <!-- 40°O = x = 280 - (2 * 31.1) = 217.8 -->
    <line x1="217.8" y1="0" x2="217.8" y2="280" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3" />
    <text x="217.8" y="-8" font-size="9" fill="#ef4444" font-weight="bold" text-anchor="middle">40°O</text>

    <!-- Leste (Direita de Greenwich) -->
    <!-- 20°L = x = 280 + 31.1 = 311.1 -->
    <line x1="311.1" y1="0" x2="311.1" y2="280" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3" />
    <text x="311.1" y="-8" font-size="9" fill="#ef4444" font-weight="bold" text-anchor="middle">20°L</text>

    <!-- 80°L = x = 280 + (4 * 31.1) = 404.4 -->
    <line x1="404.4" y1="0" x2="404.4" y2="280" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3" />
    <text x="404.4" y="-8" font-size="9" fill="#ef4444" font-weight="bold" text-anchor="middle">80°L</text>

    <!-- Contorno mundi simplificado para contexto -->
    <!-- América do Norte -->
    <path d="M 50,40 Q 110,30 140,50 Q 150,90 120,120 Q 90,100 60,70 Z" fill="#e2e8f0" opacity="0.6" />
    <!-- América do Sul -->
    <path d="M 180,140 Q 230,160 210,230 Q 190,260 170,220 Z" fill="#e2e8f0" opacity="0.6" />
    <!-- Europa e África -->
    <path d="M 260,60 Q 300,50 310,90 L 320,130 Q 330,200 290,240 Q 260,180 270,120 Z" fill="#e2e8f0" opacity="0.6" />
    <!-- Ásia -->
    <path d="M 330,40 Q 450,40 470,100 Q 420,140 370,110 Z" fill="#e2e8f0" opacity="0.6" />

    <!-- PONTOS -->
    <!-- PONTO A: 50° Norte, 100° Oeste -> x=124.5, y=52.5 -->
    <circle cx="124.5" cy="52.5" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
    <rect x="134" y="42" width="22" height="20" fill="#ef4444" rx="4" />
    <text x="145" y="56" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>

    <!-- PONTO B: 40° Norte, 80° Leste -> x=404.4, y=70 -->
    <circle cx="404.4" cy="70" r="6" fill="#3b82f6" stroke="#ffffff" stroke-width="2" />
    <rect x="414" y="60" width="22" height="20" fill="#3b82f6" rx="4" />
    <text x="425" y="74" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">B</text>

    <!-- PONTO C: 20° Sul, 40° Oeste -> x=217.8, y=175 -->
    <circle cx="217.8" cy="175" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2" />
    <rect x="227" y="165" width="22" height="20" fill="#10b981" rx="4" />
    <text x="238" y="179" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text>

    <!-- PONTO D: 10° Sul, 20° Leste -> x=311.1, y=157.5 -->
    <circle cx="311.1" cy="157.5" r="6" fill="#8b5cf6" stroke="#ffffff" stroke-width="2" />
    <rect x="321" y="147.5" width="22" height="20" fill="#8b5cf6" rx="4" />
    <text x="332" y="161.5" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">D</text>

    <!-- Legenda de Hemisférios -->
    <text x="140" y="270" font-size="10" fill="#64748b" text-anchor="middle">Hemisfério Ocidental (Oeste)</text>
    <text x="420" y="270" font-size="10" fill="#64748b" text-anchor="middle">Hemisfério Oriental (Leste)</text>
  </g>

  <text x="325" y="365" text-anchor="middle" font-size="10" fill="#64748b">Fonte: adenilsongiovanini.com.br/blog/coordenadas-geograficas-o-que-sao/</text>
</svg>
