<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" width="100%" height="auto" style="max-width: 500px; font-family: sans-serif; background: #ffffff; border-radius: 12px; padding: 12px; border: 1px solid #e2e8f0;">
  <text x="260" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Biomas Brasileiros</text>
  
  <!-- Legenda dos biomas -->
  <g transform="translate(20, 48)" font-size="12" fill="#334155">
    <rect x="0" y="0" width="14" height="12" fill="#22c55e" rx="2" />
    <text x="20" y="10">Amazônia</text>

    <rect x="0" y="22" width="14" height="12" fill="#eab308" rx="2" />
    <text x="20" y="32">Cerrado</text>

    <rect x="0" y="44" width="14" height="12" fill="#ef4444" rx="2" />
    <text x="20" y="54">Caatinga</text>

    <rect x="0" y="66" width="14" height="12" fill="#ec4899" rx="2" stroke="#db2777" stroke-width="1.5" />
    <text x="20" y="76" font-weight="bold" fill="#db2777">Mata Atlântica</text>

    <rect x="0" y="88" width="14" height="12" fill="#06b6d4" rx="2" />
    <text x="20" y="98">Pantanal</text>

    <rect x="0" y="110" width="14" height="12" fill="#8b5cf6" rx="2" />
    <text x="20" y="120">Pampa</text>
  </g>

  <!-- Mapa esquemático do Brasil destacando a Mata Atlântica -->
  <g transform="translate(130, 45)">
    <!-- Amazônia -->
    <path d="M 40,70 Q 70,25 150,25 Q 210,35 230,85 Q 210,130 180,145 Q 120,150 70,120 Z" fill="#22c55e" stroke="#ffffff" stroke-width="1.5" />
    <text x="120" y="80" font-size="12" font-weight="bold" fill="#ffffff">Amazônia</text>

    <!-- Caatinga -->
    <path d="M 230,75 Q 280,60 305,95 Q 280,135 240,130 Q 230,100 230,75 Z" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
    <text x="260" y="105" font-size="10" font-weight="bold" fill="#ffffff">Caatinga</text>

    <!-- Cerrado -->
    <path d="M 150,140 Q 220,130 240,135 Q 245,210 210,240 Q 150,220 130,170 Z" fill="#eab308" stroke="#ffffff" stroke-width="1.5" />
    <text x="185" y="185" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Cerrado</text>

    <!-- Pantanal -->
    <path d="M 120,195 Q 145,190 145,225 Q 130,240 115,220 Z" fill="#06b6d4" stroke="#ffffff" stroke-width="1.5" />
    <text x="130" y="215" font-size="8" font-weight="bold" fill="#ffffff">Pantanal</text>

    <!-- Mata Atlântica (destacada em Rosa ao longo do litoral e interior) -->
    <path d="M 305,95 Q 320,120 305,155 Q 280,215 250,265 Q 215,290 170,300 L 165,275 Q 210,265 230,230 Q 250,180 275,130 Q 295,110 305,95 Z" fill="#ec4899" stroke="#be185d" stroke-width="2" />
    <text x="285" y="240" font-size="11" font-weight="bold" fill="#be185d" transform="rotate(65 285,240)">Mata Atlântica</text>

    <!-- Pampa -->
    <path d="M 155,300 Q 185,295 185,340 Q 150,350 140,320 Z" fill="#8b5cf6" stroke="#ffffff" stroke-width="1.5" />
    <text x="160" y="325" font-size="9" font-weight="bold" fill="#ffffff">Pampa</text>
  </g>

  <text x="260" y="445" text-anchor="middle" font-size="10" fill="#64748b">Fonte: novaescola.org.br/planos-de-aula/fundamental/7ano/ciencias/mapeando-os-biomas-brasileiros/2033</text>
</svg>
